services:
  - type: web
    name: korea-stock-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DART_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
